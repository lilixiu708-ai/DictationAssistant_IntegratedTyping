name: Windows desktop app with preinstalled typing plugin

on:
  push:
    branches: ['main', 'master']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK on CI runner
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop application and sideloaded DLLs
        shell: cmd
        run: call build-windows-typing.cmd
      - name: Validate portable archive and DLL content
        shell: cmd
        run: python scripts\verify_build.py
      - name: Prepare versioned release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: cmd
        run: python scripts\prepare_release.py "%GITHUB_REF_NAME%"
      - name: Upload portable Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: DictationAssistant-Integrated-Typing-Windows-x64
          path: artifacts/DictationAssistant_IntegratedTyping_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/release/${{ github.ref_name }}/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Publish validated tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo "Refusing to replace an already published release. Use a new version."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "DictationAssistant Typing $RELEASE_TAG" --notes-file CHANGELOG.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
          gh release view "$RELEASE_TAG" --json url --jq .url
